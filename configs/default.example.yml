port: 2001
frequencies:
  electrical_data: 1m
  room_data: 15m
homeassistant:
  url: http://<address>:8123
  token: <token>
  room_sensors:
    <room_name>:
      temperature: sensor.<entity_id>
      humidity: sensor.<entity_id>
      battery: sensor.<entity_id>
philips_hue:
  url: https://<address>
  token: <token>
  devices:
    <device_id>: <device_name>
    <device_id>: <device_name>
influxdb:
  url: http://<address>:8086
  token: <token>
  organization: <org_name>
  bucket: <bucket_name>